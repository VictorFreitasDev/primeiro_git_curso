<!DOCTYPE html>
<html lang="en">

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alunos</title>

</head>

<body>
  <div class="container-fluid">
    <div class="container">
      <h1 class="text-center mt-3">Cadastro de Alunos</h1>

      <div class="row">
        <form action="#" class="form-control">
          <div class="row">
            <div class="col-10">
              <input type="text" class="form-control" placeholder="Digite o seu nome" aria-label="Nome Completo">
            </div>
            <div class="col-2">
              <input type="text" class="form-control" placeholder="Digite o seu cep" aria-label="CEP">
            </div>
          </div>

          <div class="row mt-3">
            <div class="col-6">
              <input type="text" class="form-control" placeholder="Endereço" aria-label="Endereço">
            </div>
            <div class="col-4">
              <input type="text" class="form-control" placeholder="Bairro" aria-label="Bairro">
            </div>
            <div class="col-2">
              <input type="text" class="form-control" placeholder="Número" aria-label="Número">
            </div>
          </div>

          <div class="row mt-3">
            <div class="col-4">
              <input type="text" class="form-control" placeholder="Telefone" aria-label="Telefone">
            </div>
            <div class="col-6">
              <input type="text" class="form-control" placeholder="E-MAIL" aria-label="E-MAIL">
            </div>
            <div class="col-2">
              <input type="date" class="form-control" placeholder="Data de Nascimento" aria-label="Data de Nascimento">
            </div>
          </div>
          
                    <div class="row mt-3">
            <div class="col-4">
              <select class="form-select" aria-label="Default">
                <option selected> Selecione seu Gênero</option>
                <option value="1">Masculino</option>
                <option value="2">Feminino</option>
                <option value="3">67 - SIX SEVEN</option>
              </select>
            </div>
            <div class="col-4">
              <input type="text" class="form-control" placeholder="RG" aria-label="RG">
            </div>
            <div class="col-4">
              <input type="text" class="form-control" placeholder="CPF" aria-label="CPF">
            </div>
          </div>

          <div class="row">
            <div class="col-12 mt-3">
            <textarea class="form-control" rows="3" placeholder="Observações" aria-label="Observações"></textarea>
          </div>
          </div>
        </form>

      </div>
    </div>
  </div>

</body>

</html>
